name: Adelaide Events - Daily Safe Publish

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Choose whether to scrape events or publish existing website files only"
        required: true
        type: choice
        default: website_only
        options:
          - website_only
          - full_update
  schedule:
    # 05:30 Adelaide local time (daylight-saving aware).
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: adelaide-events-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      TZ: Australia/Adelaide
    steps:
      - name: Determine publish mode and Adelaide local schedule time
        id: local_time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.publish_mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_MODE" = "full_update" ]; then
              echo "run_scraper=true" >> "$GITHUB_OUTPUT"
              echo "publish_site=true" >> "$GITHUB_OUTPUT"
              echo "Manual full update: scrape, validate, and publish."
            else
              echo "run_scraper=false" >> "$GITHUB_OUTPUT"
              echo "publish_site=true" >> "$GITHUB_OUTPUT"
              echo "Manual website-only publish: no scraping or event database commits."
            fi
          elif [ "$(TZ=Australia/Adelaide date +%H)" = "05" ]; then
            echo "run_scraper=true" >> "$GITHUB_OUTPUT"
            echo "publish_site=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled daily full update."
          else
            echo "run_scraper=false" >> "$GITHUB_OUTPUT"
            echo "publish_site=false" >> "$GITHUB_OUTPUT"
            echo "Skipping non-matching daylight-saving schedule."
          fi

      - name: Check out main
        if: steps.local_time.outputs.publish_site == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python 3.13
        if: steps.local_time.outputs.run_scraper == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Scraper/requirements.txt

      - name: Install dependencies
        if: steps.local_time.outputs.run_scraper == 'true'
        run: python -m pip install -r Scraper/requirements.txt

      - name: Validate required files
        if: steps.local_time.outputs.publish_site == 'true'
        shell: bash
        run: |
          for file in index.html script.js style.css events.json; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          if [ "${{ steps.local_time.outputs.run_scraper }}" = "true" ]; then
            for file in Scraper/scrape.py Scraper/parsers.py Scraper/config.py Scraper/humanitix.py Scraper/festival_tags.py Scraper/requirements.txt Scraper/audit_events.py recurring_rules.json recurring_sessions.json; do
              test -f "$file" || { echo "::error::Missing $file"; exit 1; }
            done
          fi

      - name: Save baseline event data
        if: steps.local_time.outputs.run_scraper == 'true'
        run: cp events.json "$RUNNER_TEMP/events-before.json"

      - name: Scrape live sources
        if: steps.local_time.outputs.run_scraper == 'true'
        shell: bash
        run: |
          set -o pipefail
          python Scraper/scrape.py 2>&1 | tee scraper-publish.log

      - name: Validate output and summarise changes
        if: steps.local_time.outputs.run_scraper == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from collections import Counter
          from pathlib import Path

          before = json.loads(Path(os.environ['RUNNER_TEMP'], 'events-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('events.json').read_text(encoding='utf-8'))
          errors = []
          if not isinstance(before, list) or not isinstance(after, list):
              errors.append('Event database must be a JSON list')
          else:
              old_count, new_count = len(before), len(after)
              if old_count < 1 or new_count < 1:
                  errors.append('Empty input or output event database')
              if new_count < max(100, int(old_count * 0.85)):
                  errors.append(f'Unexpected reduction: {old_count} -> {new_count} (more than 15%)')
              if new_count > max(2000, int(old_count * 1.5)):
                  errors.append(f'Unexpected increase: {old_count} -> {new_count} (more than 50%)')
              for i, event in enumerate(after):
                  if not isinstance(event, dict):
                      errors.append(f'Event {i} is not an object')
                      continue
                  for field in ('title', 'venue', 'datetime'):
                      if not isinstance(event.get(field), str) or not event[field].strip():
                          errors.append(f'Event {i} missing {field}')
              def key(e):
                  return (str(e.get('title', '')).strip().casefold(), str(e.get('venue', '')).strip().casefold(), str(e.get('datetime', '')), str(e.get('link', '')).strip())
              if all(isinstance(e, dict) for e in after):
                  duplicates = sum(n-1 for n in Counter(map(key, after)).values() if n > 1)
                  if duplicates:
                      errors.append(f'{duplicates} duplicate records with same title, venue, datetime and link')
              print(f'Events before: {old_count}; events after: {new_count}; difference: {new_count - old_count:+d}')
          if errors:
              for error in errors[:30]:
                  print(f'::error::{error}')
              sys.exit(1)
          print('Event database validation passed.')
          PY

      - name: Generate read-only event accuracy report
        if: steps.local_time.outputs.run_scraper == 'true'
        shell: bash
        run: |
          python Scraper/audit_events.py
          echo "### Event accuracy audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,24p' reports/event_audit_summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the CSV and full summary from the event-accuracy-audit artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload event accuracy audit
        if: always() && steps.local_time.outputs.run_scraper == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: event-accuracy-audit
          path: |
            reports/event_audit.csv
            reports/event_audit_summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Commit updated events database if changed
        if: steps.local_time.outputs.run_scraper == 'true'
        shell: bash
        run: |
          if git diff --quiet -- events.json; then
            echo 'No event database changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- events.json
            git commit -m 'Update Adelaide events database [scheduled publish]'
            git push origin HEAD:main
          fi

      - name: Prepare public website files
        if: steps.local_time.outputs.publish_site == 'true'
        shell: bash
        run: |
          mkdir -p _site
          cp index.html script.js style.css events.json _site/
          if [ -d assets ]; then cp -a assets _site/; fi
          test -f quizmeisters-trivia.svg || { echo "::error::Missing quizmeisters-trivia.svg"; exit 1; }
          cp quizmeisters-trivia.svg _site/
          if [ -f agsa-calendar.js ]; then cp agsa-calendar.js _site/; fi
          if [ -f agsa-calendar.html ]; then cp agsa-calendar.html _site/; fi
          if [ -f agsa-events-response.json ]; then cp agsa-events-response.json _site/; fi
          touch _site/.nojekyll

      - name: Set up GitHub Pages
        if: steps.local_time.outputs.publish_site == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.local_time.outputs.publish_site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        if: steps.local_time.outputs.publish_site == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload scraper log
        if: always() && steps.local_time.outputs.run_scraper == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adelaide-daily-publish-log
          path: scraper-publish.log
          if-no-files-found: ignore
          retention-days: 14
