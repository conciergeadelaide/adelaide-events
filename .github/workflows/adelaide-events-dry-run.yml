name: Adelaide Events - Safe Scraper Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      TZ: Australia/Adelaide
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Scraper/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r Scraper/requirements.txt

      - name: Check required files
        shell: bash
        run: |
          for file in Scraper/scrape.py Scraper/parsers.py Scraper/config.py Scraper/humanitix.py Scraper/festival_tags.py Scraper/requirements.txt events.json recurring_sessions.json recurring_rules.json; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done
          if [ -f Scraper/state_theatre_upcoming.html ]; then
            echo 'State Theatre snapshot available'
          else
            echo 'State Theatre snapshot unavailable; existing records should be preserved'
          fi
          if [ -f "Experience Adelaide _ What's on in Adelaide.html" ]; then
            echo 'Experience Adelaide snapshot available'
          else
            echo 'Experience Adelaide snapshot unavailable; existing records should be preserved'
          fi

      - name: Scrape without changing the database
        shell: bash
        run: |
          set -o pipefail
          python Scraper/scrape.py --dry-run 2>&1 | tee scraper-test.log

      - name: Verify events.json was not changed
        shell: bash
        run: |
          if ! git diff --exit-code -- events.json; then
            echo '::error::Dry run unexpectedly modified events.json'
            exit 1
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adelaide-scraper-test-log
          path: scraper-test.log
          if-no-files-found: warn
          retention-days: 7
