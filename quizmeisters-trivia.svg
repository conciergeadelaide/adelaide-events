<text x="600" y="552" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#ffffff">AT THE DISTRICT</text>
<text x="600" y="600" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="middle" fill="#c7d2fe">TRIVIA NIGHT</text>
